name: Sync ODTUClass Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Her 4 saatte bir çalışır

concurrency:
  group: odtuclass-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repoya commit atabilmek için gerekli izin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ODTUClass Sync
        env:
          ODTU_USERNAME: ${{ secrets.ODTU_USERNAME }}
          ODTU_PASSWORD: ${{ secrets.ODTU_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: npm run sync

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .odtuclass/state.json || true
          if [ -d ".odtuclass/pending" ]; then
            git add .odtuclass/pending/*.json || true
          fi
          
          if git diff --staged --quiet; then
            echo "No changes to commit. State and pending files are up to date."
          else
            git commit -m "chore: sync ODTUClass data"
            git push
            echo "Changes successfully committed and pushed."
          fi
